# openocd-rp2040-cmsis-dap.cfg – RP2040 + CMSIS-DAP probe config
# source [find ...] uses OpenOCD’s own script search path

# Use the CMSIS-DAP interface (Raspberry Pi Debug Probe)
source [find interface/cmsis-dap.cfg]

# Target is RP2040 (Pico / Pico W)
source [find target/rp2040.cfg]

# Optional but recommended: faster SWD clock
adapter speed 5000
