# openocd-rp2350-cmsis-dap.cfg – RP2350 + CMSIS-DAP probe config
# source [find ...] uses OpenOCD’s own script search path

# Use the CMSIS-DAP interface (Raspberry Pi Debug Probe)
source [find interface/cmsis-dap.cfg]

# Target is RP2350 (Pico 2 / Pico 2 W). target/rp2350.cfg is not in the
# OpenOCD 0.12.0 release: it needs OpenOCD built from master or the
# Raspberry Pi fork. Its default is both Cortex-M33 cores (Arm build).
source [find target/rp2350.cfg]

# Optional but recommended: faster SWD clock
adapter speed 5000
